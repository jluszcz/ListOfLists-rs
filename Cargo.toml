[package]
name = "list_of_lists"
authors = ["Jacob Luszcz"]
default-run = "main"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# `default` pulls in the `rustls` feature, which is the legacy hyper-0.14 client stack
# (rustls 0.21 / rustls-webpki 0.101) that nothing here uses and that no longer receives
# security fixes. `default-https-client` is the modern rustls 0.23 path the SDKs actually call.
# The feature lists below are each SDK's own defaults minus `rustls`, so nothing else changes.
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws_lambda_events = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
minify-html = "0.18"
jluszcz_rust_utils = { git = "https://github.com/jluszcz/rust-utils", features = ["aws", "cli", "lambda"] }
lambda_runtime = "1"
log = "0.4"
minijinja = { version = "2", features = ["json"] }
regex = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/lambda.rs"
