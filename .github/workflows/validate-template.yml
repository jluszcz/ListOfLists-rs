name: Validate Template

on:
  workflow_call:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Update Rust
        run: rustup update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Render Fixtures
        run: scripts/render-fixtures.sh rendered

      - name: Validate HTML/CSS
        run: npx --yes vnu-jar@26.11.19 --also-check-css --Werror rendered
