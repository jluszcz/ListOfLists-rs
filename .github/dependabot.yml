version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/shared"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/site-module"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/sites/burgerl.ist"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/sites/starl.ist"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "terraform"
    directory: "/sites/moviel.ist"
    schedule:
      interval: "monthly"
    groups:
      all-terraform:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "npm"
    directory: "/bootstrap"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-pre-commit:
        patterns:
          - "*"
    assignees:
      - "jluszcz"
